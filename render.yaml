services:
  - type: web
    name: playboxd-api
    runtime: node
    plan: free
    rootDir: backend/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Site de apresentação (página estática, não dorme no plano gratuito)
  - type: web
    name: playboxd
    runtime: static
    rootDir: site
    buildCommand: echo "Sem etapa de build"
    staticPublishPath: .
